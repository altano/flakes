# Nightly refresh of wolf/containers.json digest pins.
# Commits any digest change directly to main.
name: wolf · update container pins

on:
  schedule:
    - cron: "0 7 * * *" # nightly, 07:00 UTC
  workflow_dispatch: {}

# Allow the job to push the regenerated containers.json back to main.
permissions:
  contents: write

concurrency:
  group: wolf-update-containers
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wolf
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          # We're not registered on FlakeHub; opportunistic FlakeHub Cache just
          # emits an "Unable to authenticate to FlakeHub" annotation. Stick to
          # the GitHub Actions cache.
          use-flakehub: false

      - name: Refresh digests
        run: |
          cp generated/containers.json /tmp/old.json
          # update-containers exits non-zero (failing the job, no commit) if ANY
          # tracked image fails to resolve — it never writes a partial/empty file.
          nix run .#update-containers

      - name: Commit if changed
        run: |
          # Trace every command so a failing step is never a bare "exit code 1".
          set -x
          if git diff --quiet -- generated/containers.json; then
            echo "No digest changes."
            exit 0
          fi
          # Defense in depth: never commit an empty or shrunken pin file.
          old=$(jq '[.. | objects | select(.digest)] | length' /tmp/old.json)
          new=$(jq '[.. | objects | select(.digest)] | length' generated/containers.json)
          echo "pin count ${old} -> ${new}"
          if [ "$new" -eq 0 ] || [ "$new" -lt "$old" ]; then
            echo "REFUSING to commit: pin count ${old} -> ${new} (empty or shrunk)."
            exit 1
          fi
          # ci-message.sh's stdout is the commit message; its stderr (traces,
          # skopeo errors) flows to the CI log. If it fails, surface whatever
          # partial message it managed to emit instead of swallowing it.
          if ! nix develop -c ./ci-message.sh /tmp/old.json generated/containers.json > /tmp/msg.txt; then
            echo "::error::ci-message.sh failed; partial stdout (commit message) was:"
            cat /tmp/msg.txt || true
            exit 1
          fi
          echo "----- commit message -----"
          cat /tmp/msg.txt
          echo "--------------------------"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/containers.json
          git commit -F /tmp/msg.txt
          git push
